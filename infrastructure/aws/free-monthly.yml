AWSTemplateFormatVersion: '2010-09-09'
Description: Small Mango incident API using recurring AWS Free Tier allowances only.

Parameters:
  ApiToken:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Bearer token required by the Function URL. Generate a random value locally.
  TableName:
    Type: String
    Default: mango-free-monthly
    MinLength: 3
    MaxLength: 50
    AllowedPattern: '[A-Za-z0-9_.-]+'

Resources:
  IncidentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 20
        WriteCapacityUnits: 6
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      DeletionProtectionEnabled: false

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IncidentTableOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                  - dynamodb:UpdateItem
                Resource: !GetAtt IncidentsTable.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 128
      Timeout: 3
      ReservedConcurrentExecutions: 1
      Environment:
        Variables:
          INCIDENTS_TABLE: !Ref IncidentsTable
          MANGO_FREE_API_TOKEN: !Ref ApiToken
      Code:
        ZipFile: |
          # Generated by infrastructure/aws/render-free-monthly.py.

  ApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt ApiFunction.Arn

  PublicFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunctionUrl
      FunctionName: !Ref ApiFunction
      Principal: '*'
      FunctionUrlAuthType: NONE
      InvokedViaFunctionUrl: true

  PublicInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: HTTPS endpoint. Every route requires the configured bearer token.
    Value: !GetAtt ApiUrl.FunctionUrl
  DynamoDBTable:
    Value: !Ref IncidentsTable
