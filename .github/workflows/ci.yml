name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # The suite runs against in-memory SQLite, so no database service is needed.
      - run: pytest -q

  dummycommerce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dummycommerce
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dummycommerce/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
